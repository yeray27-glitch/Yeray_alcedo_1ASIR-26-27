<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Casa</title>
<style>
  .casa {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 175px;
    height: 355px;
  }
  .techo {
    position: absolute;
    top: 0;
    left: 0;
    border-left: 87.5px solid transparent;
    border-right: 87.5px solid transparent;
    border-bottom: 175px solid #a52a2a;
  }
  .chimenea {
    position: absolute;
    top: 35px;
    left: 35px;
    width: 35px;
    height: 70px;
    background: black;
  }
  .cuerpo {
    position: absolute;
    top: 175px;
    left: 0;
    width: 175px;
    height: 180px;
    background: gray;
  }
  .ventana {
    position: absolute;
    top: 18px;
    width: 35px;
    height: 35px;
    background: white;
  }
  .izq { left: 17px; }
  .der { right: 17px; }
  .puerta {
    position: absolute;
    bottom: 0;
    left: 60px;
    width: 53px;
    height: 93px;
    background: #a52a2a;
  }
</style>
</head>
<body>
  <div class="casa">
    <div class="techo"></div>
    <div class="chimenea"></div>
    <div class="cuerpo">
      <div class="ventana izq"></div>
      <div class="ventana der"></div>
      <div class="puerta"></div>
    </div>
  </div>
</body>
</html>
